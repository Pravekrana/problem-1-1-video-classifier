setup_commands:
  - "python -m pip install -r requirements.txt"
run_commands:
  - "python src/demo.py"
  - "python -m src.main --input demo.avi --output results.json"
test_commands:
  - "python -m pytest -q"
notes: "First run downloads ~127 MB pretrained R3D-18 weights; internet required. Synthetic demo is only a smoke test, not a real accuracy benchmark."
